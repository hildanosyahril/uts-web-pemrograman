<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Toko Buku Online</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <section class="card" style="max-width:400px;margin:40px auto;">
      <h1>Login</h1>
      <form id="formLogin">
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <label for="password">Password</label>
        <input type="password" id="password" required>
        <button type="submit">Login</button>
      </form>
      <button class="btn-gray" id="btnLupa">Lupa Password</button>
      <button class="btn-gray" id="btnDaftar">Daftar</button>
    </section>
  </main>

  <div class="modal" id="modalLupa">
    <div class="modal-content">
      <h2>Lupa Password</h2>
      <label for="emailLupa">Email terdaftar</label>
      <input type="email" id="emailLupa">
      <button id="kirimLupa">Kirim</button>
      <button class="btn-red tutup">Tutup</button>
    </div>
  </div>

  <div class="modal" id="modalDaftar">
    <div class="modal-content">
      <h2>Daftar Akun</h2>
      <label for="emailDaftar">Email</label>
      <input type="email" id="emailDaftar">
      <label for="passDaftar">Password</label>
      <input type="password" id="passDaftar">
      <button id="kirimDaftar">Daftar</button>
      <button class="btn-red tutup">Tutup</button>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
